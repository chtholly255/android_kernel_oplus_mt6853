name: 编译OPPO/Realme-安卓12-通用mt6853机型内核

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 5' # Run every friday at midnight
    
jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4






    - name: 制作Anykernel3卡刷包
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3
        sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
        sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
        sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        
    
    
    - name: 上传 Anykernel3
      uses: actions/upload-artifact@v4
      with:
        name: android-mt6853-kernel-Anykernel3
        path: kernel_workspace/AnyKernel3/*
        

    - name: 上传编译内核
      uses: actions/upload-artifact@v4
      with:
        name: Image.gz
        path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz

    - name: 发布到 GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # 使用 workflow 内置日期，格式：年月日
        tag_name: Kernel-MT6853-${{ github.run_id }}
        name: MT6853 内核编译包 ${{ github.run_started_at }}
        body: |
          自动编译 OPPO/Realme MT6853 安卓12 内核
          - 编译工具：NDK r24 Clang + GCC 4.9
          - 内置：ReSukiSU
          - 编译时间: ${{ github.run_started_at }}
        files: |
          kernel_workspace/mt6853-kernel-AnyKernel3.zip
          kernel_workspace/android-kernel/out/arch/arm64/boot/Image.gz
        # 可选：初次调试设为草稿，避免重复生成公开 Release
        # draft: true